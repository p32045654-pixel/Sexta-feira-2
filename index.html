  #core.ouvindo{background:radial-gradient(circle,#ff3b30 0%,#220000 60%);border-color:#ff3b30;box-shadow:0 0 60px #ff3b30;animation:pulse 0.6s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}

<div id="log">1º TOQUE NO NÚCLEO PARA ACORDAR</div>
<div id="core"><span id="txt">ACORDAR</span></div>

const log = document.getElementById('log');
const core = document.getElementById('core');
const txt = document.getElementById('txt');

function falar(t){
  speechSynthesis.cancel();
  let m = new SpeechSynthesisUtterance(t);
  m.lang = 'pt-BR'; m.rate=1.1;
  log.innerText = "SEXTA: " + t;
  speechSynthesis.speak(m);
}

function abrir(nome, pkg, url){
  falar("Sim chefe, abrindo "+nome);
  setTimeout(()=>{
    window.location.href = "intent://#Intent;package="+pkg+";S.browser_fallback_url="+encodeURIComponent(url)+";end";
  },800);
}
